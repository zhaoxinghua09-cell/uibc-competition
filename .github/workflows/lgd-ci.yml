name: LGD CI

# 共享守门：布局 + JSON 卫生。业务测试保留在仓内自有 CI。
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    uses: LGD-AI/lgd-ci/.github/workflows/lgd-reusable-ci.yml@a4ec72a95b8889f2270829a2923831bfe8286994
    with:
      python-version: "3.11"
      run-tests: false
      require-skill-md: false